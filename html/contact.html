<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Juan De Manuel using the contact form on his frontend developer portfolio.">
    <meta name="author" content="Juan De Manuel">
    <title>Contact | Juan De Manuel</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="contact-page">
    <header>
        <nav aria-label="Main navigation" id="navigation">
            <div id="logo">
                <img src="juan.png" height="70" width="70" alt="Juan De Manuel">
                <p>Juan De Manuel</p>
            </div>
            <span id="nav-links">
                <a href="homepage.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="articles.html">Articles</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </span>
        </nav>
    </header>

    <main>
        <h1>Contact Me</h1>
        <form>
            <fieldset>
                <legend>Send me a message</legend>

                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="6" cols="40" required></textarea>
                </p>

                <button type="submit">Send Message</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Juan De Manuel. All rights reserved.</p>
    </footer>
</body>
</html>
